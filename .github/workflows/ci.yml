name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax & Unit Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip Chromium download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - name: Syntax check ESM sources
        run: |
          for f in src/*.js src/routes/*.js public/*.js extension/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: Run unit tests
        run: npm test
