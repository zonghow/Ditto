<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Ditto</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo ditto-logo" viewBox="0 0 256 256" fill="none" aria-hidden="true"><rect width="256" height="256" rx="58" fill="#0a0b0e"/><rect class="card-rim" x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5"/><path class="slash-frame" d="M 94.75 55.51 A 8.5 8.5 0 0 1 102.5 50.5 L 137.79 50.5 A 4.5 4.5 0 0 1 141.89 56.85 L 77.25 200.49 A 8.5 8.5 0 0 1 69.5 205.5 L 34.21 205.5 A 4.5 4.5 0 0 1 30.11 199.15 L 94.75 55.51 Z" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"/><path class="slash-frame" d="M 178.75 55.51 A 8.5 8.5 0 0 1 186.5 50.5 L 221.79 50.5 A 4.5 4.5 0 0 1 225.89 56.85 L 161.25 200.49 A 8.5 8.5 0 0 1 153.5 205.5 L 118.21 205.5 A 4.5 4.5 0 0 1 114.11 199.15 L 178.75 55.51 Z" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"/><path class="slash-ghost-2" d="M 88.82 52.84 A 15 15 0 0 1 102.5 44 L 137.79 44 A 11 11 0 0 1 147.82 59.51 L 83.18 203.16 A 15 15 0 0 1 69.5 212 L 34.21 212 A 11 11 0 0 1 24.18 196.49 L 88.82 52.84 Z" fill="#6b95ff" fill-opacity="0.38"/><path class="slash-ghost-1" d="M 88.82 52.84 A 15 15 0 0 1 102.5 44 L 137.79 44 A 11 11 0 0 1 147.82 59.51 L 83.18 203.16 A 15 15 0 0 1 69.5 212 L 34.21 212 A 11 11 0 0 1 24.18 196.49 L 88.82 52.84 Z" fill="#ffffff" fill-opacity="0.44"/><path class="slash-slider" d="M 88.82 52.84 A 15 15 0 0 1 102.5 44 L 137.79 44 A 11 11 0 0 1 147.82 59.51 L 83.18 203.16 A 15 15 0 0 1 69.5 212 L 34.21 212 A 11 11 0 0 1 24.18 196.49 L 88.82 52.84 Z" fill="#ffffff"/></svg>
      <span class="brand-title">ditto</span>
    </div>
    <span id="automatic-status" class="conn-pill">未配对</span>
    <button id="viewer" class="viewer-btn" type="button">观测页 ↗</button>
  </header>

  <main>
    <section id="pairing-section" class="card">
      <div class="input-group">
        <input id="pairing" type="text" autocomplete="off" spellcheck="false" placeholder="http://开发机IP:3217" aria-label="开发机服务地址">
        <button id="save-pairing" class="btn-primary" type="button">连接</button>
      </div>
    </section>

    <section id="connected-bar" class="endpoint-bar" hidden>
      <span class="endpoint-dot"></span>
      <span id="paired" class="endpoint-text">未配对</span>
      <button id="forget" class="btn-ghost" type="button">切换</button>
    </section>

    <section class="card controls-card">
      <button id="sync" class="btn-secondary" type="button">立即全量同步</button>
      <div id="last-sync-meta" class="sync-meta">每 5 分钟全量同步 Cookie · 新开页主动同步</div>
    </section>

    <div id="result" class="toast" role="status" hidden></div>
  </main>
</body>
</html>
